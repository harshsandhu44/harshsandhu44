name: Generate pac0 SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One writer at a time: the job commits to main, so overlapping runs would race
# on the push.
concurrency:
  group: pac0
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Full history so the rebase before pushing has something to rebase onto.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: mkdir -p assets

      - uses: harshsandhu44/pac0@main
        with:
          username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output: assets/pac0.svg

      # assets/ sits outside apps/personal and packages/, which is the whole
      # point: the Vercel project's ignoreCommand diffs exactly those two paths,
      # sees nothing, and skips the build. Committing this anywhere inside the
      # app would trigger a full production deploy every night.
      - name: Commit the SVG if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/pac0.svg
          if git diff --staged --quiet; then
            echo "pac0.svg unchanged — nothing to commit"
            exit 0
          fi
          # [skip ci] keeps the CI workflow off a generated-asset commit.
          git commit -m "chore: update pac0.svg [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
